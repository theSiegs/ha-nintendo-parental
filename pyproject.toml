[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Copied from core; only the import path differs, which moves the import into
# another isort section. Kept as is to stay diffable against core.
"tests/conftest.py" = ["I001"]
"tests/test_config_flow.py" = ["I001"]
"tests/test_services.py" = ["I001"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["homeassistant"]
known-local-folder = ["custom_components"]
split-on-trailing-comma = false
